name: Build & Deploy PDF

on:
  push:
    branches: [master]
    paths:
      - '**.tex'
      - '**.dtd'
      - '**.csv'
      - 'Makefile'
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install LaTeX
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base \
            texlive-latex-extra \
            texlive-latex-recommended \
            texlive-fonts-recommended \
            texlive-fonts-extra \
            texlive-pictures \
            texlive-science \
            latexmk

      - name: Build PDF
        run: make

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: controls-submittal-pdf
          path: build/Master File.pdf
          retention-days: 90

  deploy:
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install LaTeX
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base \
            texlive-latex-extra \
            texlive-latex-recommended \
            texlive-fonts-recommended \
            texlive-fonts-extra \
            texlive-pictures \
            texlive-science \
            latexmk

      - name: Build PDF
        run: make

      - name: Prepare Pages content
        run: |
          mkdir -p _site
          cp "build/Master File.pdf" _site/controls-submittal.pdf
          cat > _site/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Controls Submittal</title>
            <style>
              body { font-family: Arial, sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
              h1 { color: #326cb7; }
              a.btn {
                display: inline-block; margin-top: 1rem; padding: .75rem 1.5rem;
                background: #326cb7; color: white; text-decoration: none;
                border-radius: 4px; font-size: 1.1rem;
              }
              a.btn:hover { background: #245a9e; }
            </style>
          </head>
          <body>
            <h1>Controls Submittal</h1>
            <p>Latest compiled document:</p>
            <a class="btn" href="controls-submittal.pdf" download>Download PDF</a>
            <br><br>
            <iframe src="controls-submittal.pdf" width="100%" height="700px" style="border:1px solid #ccc;"></iframe>
          </body>
          </html>
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
